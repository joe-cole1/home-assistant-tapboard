  # Tap Selectors
  - select:
      - name: 'Tap 1 Batch Select'
        unique_id: tap_1_batch_select
        state: >-
          {% set current = states('input_text.tap_1_batch') %}
          {% set batches = state_attr('sensor.brewfather_active_batches', 'batches') or [] %}
          {% set ns = namespace(value='') %}
          {% for item in batches if item.id == current %}
            {% set ns.value = item.id + ' | ' + item.label %}
          {% endfor %}
          {% if current in ['unknown', 'unavailable', ''] %}
            {{ '' }}
          {% elif current == 'custom:topo_chico' %}
            {{ 'custom:topo_chico | Tapboard Custom Beverage' }}
          {% else %}
            {{ ns.value or current + ' | Current assignment' }}
          {% endif %}
        options: >-
          {% set current = states('input_text.tap_1_batch') %}
          {% set batches = state_attr('sensor.brewfather_active_batches', 'batches') or [] %}
          {% set ns = namespace(opts=[''], ids=[]) %}
          {% for item in batches %}
            {% set ns.opts = ns.opts + [item.id + ' | ' + item.label] %}
            {% set ns.ids = ns.ids + [item.id] %}
          {% endfor %}
          {% set ns.opts = ns.opts + ['custom:topo_chico | Tapboard Custom Beverage'] %}
          {% if current not in ['unknown', 'unavailable', '', 'custom:topo_chico'] and current not in ns.ids %}
            {% set ns.opts = ns.opts + [current + ' | Current assignment'] %}
          {% endif %}
          {{ ns.opts }}
        select_option:
          - action: input_text.set_value
            target:
              entity_id: input_text.tap_1_batch
            data:
              value: "{{ option.split(' | ')[0] if ' | ' in option else option }}"

