# =====================================================================
# TAPBOARD BREWFATHER PACKAGE
# Canonical Brewfather API v2 commands and active-batch synchronization.
# Fermentation packages may consume these entities but must not redefine them.
# =====================================================================

rest_command:
  brewfather_list_batches:
    url: >-
      https://api.brewfather.app/v2/batches?status={{ status | urlencode }}&limit=50&include=recipe.style,estimatedAbv,measuredAbv
    method: GET
    username: !secret brewfather_user_id
    password: !secret brewfather_api_key

  brewfather_get_batch:
    url: 'https://api.brewfather.app/v2/batches/{{ batch_id | urlencode }}'
    method: GET
    username: !secret brewfather_user_id
    password: !secret brewfather_api_key

  brewfather_complete_batch:
    url: 'https://api.brewfather.app/v2/batches/{{ batch_id | urlencode }}'
    method: PATCH
    headers:
      Content-Type: 'application/json'
    username: !secret brewfather_user_id
    password: !secret brewfather_api_key
    payload: '{"status": "Completed"}'

template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        hours: '/6'
      - trigger: state
        entity_id: input_button.brewery_brewfather_refresh
    actions:
      - action: rest_command.brewfather_list_batches
        data:
          status: Planning
        response_variable: planning_response
        continue_on_error: true
      - action: rest_command.brewfather_list_batches
        data:
          status: Fermenting
        response_variable: fermenting_response
        continue_on_error: true
      - action: rest_command.brewfather_list_batches
        data:
          status: Conditioning
        response_variable: conditioning_response
        continue_on_error: true
    sensor:
      - name: 'Brewfather Active Batches'
        unique_id: brewfather_active_batches
        icon: mdi:beer-outline
        state: >-
          {% set ok =
            planning_response is defined and planning_response.get('status', 0) | int == 200 and
            planning_response.get('content') is sequence and planning_response.get('content') is not string and planning_response.get('content') is not mapping and
            fermenting_response is defined and fermenting_response.get('status', 0) | int == 200 and
            fermenting_response.get('content') is sequence and fermenting_response.get('content') is not string and fermenting_response.get('content') is not mapping and
            conditioning_response is defined and conditioning_response.get('status', 0) | int == 200 and
            conditioning_response.get('content') is sequence and conditioning_response.get('content') is not string and conditioning_response.get('content') is not mapping %}
          {{ now().isoformat() if ok else this.state | default('unavailable') }}
        attributes:
          batches: >-
            {% set ok =
              planning_response is defined and planning_response.get('status', 0) | int == 200 and
              planning_response.get('content') is sequence and planning_response.get('content') is not string and planning_response.get('content') is not mapping and
              fermenting_response is defined and fermenting_response.get('status', 0) | int == 200 and
              fermenting_response.get('content') is sequence and fermenting_response.get('content') is not string and fermenting_response.get('content') is not mapping and
              conditioning_response is defined and conditioning_response.get('status', 0) | int == 200 and
              conditioning_response.get('content') is sequence and conditioning_response.get('content') is not string and conditioning_response.get('content') is not mapping %}
            {% if ok %}
              {% set ns = namespace(items=[]) %}
              {% for response in [planning_response, fermenting_response, conditioning_response] %}
                {% for batch in response.get('content', []) if batch is mapping %}
                  {% set batch_id = batch.get('_id', '') | string %}
                  {% set recipe = batch.get('recipe', {}) if batch.get('recipe', {}) is mapping else {} %}
                  {% set name = batch.get('name') or recipe.get('name') or 'Unnamed batch' %}
                  {% set status = batch.get('status', '') | string %}
                  {% set style_data = recipe.get('style', {}) %}
                  {% set style = style_data.get('name', '') if style_data is mapping else style_data | string %}
                  {% set abv = batch.get('measuredAbv') if batch.get('measuredAbv') is not none else batch.get('estimatedAbv') %}
                  {% set display_status = 'Planned' if status == 'Planning' else status %}
                  {% if batch_id and status in ['Planning', 'Fermenting', 'Conditioning'] %}
                    {% set ns.items = ns.items + [{
                      'id': batch_id,
                      'name': name | string,
                      'label': (name | string) ~ ' (' ~ display_status ~ ')',
                      'status': status,
                      'style': style | string,
                      'abv': abv
                    }] %}
                  {% endif %}
                {% endfor %}
              {% endfor %}
              {{ ns.items }}
            {% else %}
              {{ this.attributes.get('batches', []) }}
            {% endif %}
          last_success_at: >-
            {% set ok =
              planning_response is defined and planning_response.get('status', 0) | int == 200 and
              planning_response.get('content') is sequence and planning_response.get('content') is not string and planning_response.get('content') is not mapping and
              fermenting_response is defined and fermenting_response.get('status', 0) | int == 200 and
              fermenting_response.get('content') is sequence and fermenting_response.get('content') is not string and fermenting_response.get('content') is not mapping and
              conditioning_response is defined and conditioning_response.get('status', 0) | int == 200 and
              conditioning_response.get('content') is sequence and conditioning_response.get('content') is not string and conditioning_response.get('content') is not mapping %}
            {{ now().isoformat() if ok else this.attributes.get('last_success_at') }}
          last_attempt_at: '{{ now().isoformat() }}'
          refresh_status: >-
            {% set ok =
              planning_response is defined and planning_response.get('status', 0) | int == 200 and
              planning_response.get('content') is sequence and planning_response.get('content') is not string and planning_response.get('content') is not mapping and
              fermenting_response is defined and fermenting_response.get('status', 0) | int == 200 and
              fermenting_response.get('content') is sequence and fermenting_response.get('content') is not string and fermenting_response.get('content') is not mapping and
              conditioning_response is defined and conditioning_response.get('status', 0) | int == 200 and
              conditioning_response.get('content') is sequence and conditioning_response.get('content') is not string and conditioning_response.get('content') is not mapping %}
            {{ 'ok' if ok else 'error' }}
