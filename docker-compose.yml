name: home-assistant-tapboard

services:
  tapboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tapboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HA_URL=${HA_URL:-http://192.168.0.35:8123}
      - HA_TOKEN=${HA_TOKEN}
      - BREWFATHER_USER_ID=${BREWFATHER_USER_ID:-}
      - BREWFATHER_API_KEY=${BREWFATHER_API_KEY:-}
      - BREWFATHER_TIMEOUT_MS=${BREWFATHER_TIMEOUT_MS:-10000}
      - BREWFATHER_MAX_RESPONSE_BYTES=${BREWFATHER_MAX_RESPONSE_BYTES:-1048576}
      - BREWFATHER_REQUEST_BUDGET=${BREWFATHER_REQUEST_BUDGET:-100}
      - TAPBOARD_PUBLIC_ORIGIN=${TAPBOARD_PUBLIC_ORIGIN:-}
      - TAPBOARD_INITIAL_ADMIN_PIN=${TAPBOARD_INITIAL_ADMIN_PIN:-}
      - TAPBOARD_EXPECT_EXISTING_DATA=${TAPBOARD_EXPECT_EXISTING_DATA:-true}
      - BACKUP_DIR=/app/backups
    volumes:
      - tapboard_data:/app/data
      - tapboard_backups:/app/backups
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tapboard_data:
    name: tapboard_data
  tapboard_backups:
    name: tapboard_backups
