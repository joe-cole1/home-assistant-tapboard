name: home-assistant-tapboard

services:
  tapboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tapboard
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HA_URL=${HA_URL:-http://192.168.0.35:8123}
      - HA_TOKEN=${HA_TOKEN}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/state"]
      interval: 30s
      timeout: 5s
      retries: 3
