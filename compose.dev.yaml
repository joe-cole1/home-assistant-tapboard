name: tapboard-dev

services:
  tapboard:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      TAPBOARD_HOST: 0.0.0.0
      TAPBOARD_PORT: "3000"
      TAPBOARD_DATABASE_PATH: /app/data/tapboard-v2.sqlite3
      TAPBOARD_SECRET_KEY: ${TAPBOARD_SECRET_KEY:?Set TAPBOARD_SECRET_KEY in the ignored .env file}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - tapboard-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:3000/healthz")
          .then((response) => process.exit(response.status === 200 ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  tapboard-data:
