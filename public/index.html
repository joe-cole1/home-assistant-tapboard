<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hazardous Brews - Tapboard v3</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Carter+One&family=Fredoka:wght@400;600;700&family=Montserrat:wght@400;600;700;800&family=Outfit:wght@400;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="modern_dark">

  <!-- Header -->
  <header class="app-header">
    <div class="header-title-container">
      <h1 class="header-title" id="headerTitle">Hazardous Brews</h1>
    </div>
    <div class="header-right">
      <div class="header-info-badge" title="Connection Status">
        <span style="font-size:1.1rem;">⚡</span>
        <span id="headerClock">Live Stream Connected</span>
      </div>
      <button class="btn-icon" id="settingsBtn" title="Settings Studio">⚙️</button>
    </div>
  </header>

  <!-- Main Tap Grid Area -->
  <main class="main-content">
    <div class="tap-grid" id="tapGrid">
      <!-- Dynamic Tap Cards injected by app.js -->
    </div>
  </main>

  <!-- On Deck Fermenting Pipeline Ticker -->
  <footer class="ondeck-ticker-container" id="onDeckTicker">
    <div class="ondeck-label">
      <span>🌾</span> ON DECK:
    </div>
    <div class="ondeck-items" id="onDeckItems">
      <span class="ondeck-item">Loading upcoming brews...</span>
    </div>
  </footer>

  <!-- Toast Notification Container for Real-Time Pour Alerts -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Recipe Detail Modal -->
  <div id="recipeModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:400; align-items:center; justify-content:center; backdrop-filter:blur(8px); padding:1.5rem;">
    <div style="background:var(--bg-header); border:1px solid var(--border-color); padding:2rem; border-radius:1.25rem; width:100%; max-width:550px; box-shadow:0 25px 50px rgba(0,0,0,0.7); color:var(--text-main);">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:1rem; margin-bottom:1.25rem;">
        <h2 id="recipeTitle" style="font-family:var(--font-title); color:var(--accent-color); margin:0; font-size:1.6rem;">Beer Name</h2>
        <button class="btn-icon" id="closeRecipeBtn" style="font-size:1.4rem;">✕</button>
      </div>
      <div id="recipeBody" style="display:flex; flex-direction:column; gap:1rem; font-size:0.95rem;">
        <!-- Recipe specs dynamically injected -->
      </div>
    </div>
  </div>

  <!-- PIN Verification Modal -->
  <div id="pinModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:300; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
    <div style="background:var(--bg-header); border:1px solid var(--border-color); padding:2rem; border-radius:1rem; width:320px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.5);">
      <h3 style="font-family:var(--font-title); margin-bottom:1rem; color:var(--accent-color);">Admin Access</h3>
      <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:1.25rem;">Enter 4-Digit PIN to unlock settings:</p>
      <input type="password" id="pinInput" class="form-control" maxlength="4" placeholder="••••" style="width: 100%; box-sizing: border-box; font-size:1.75rem; text-align:center; letter-spacing:0.4em; margin-bottom:1.25rem;" />
      <button id="pinSubmitBtn" class="btn-primary" style="width:100%;">Unlock</button>
    </div>
  </div>

  <!-- Tap Settings Studio Modal -->
  <div id="tapSettingsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:250; align-items:center; justify-content:center; backdrop-filter:blur(5px); overflow-y:auto; padding:2rem;">
    <div style="background:var(--bg-header); border:1px solid var(--border-color); padding:2rem; border-radius:1rem; width:100%; max-width:550px; box-shadow:0 20px 40px rgba(0,0,0,0.5); display:flex; flex-direction:column; gap:1.25rem; max-height:90vh; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:0.75rem;">
        <h3 id="tapSettingsTitle" style="font-family:var(--font-title); color:var(--accent-color); margin:0;">Tap Settings Studio</h3>
        <button class="btn-icon" id="closeTapSettingsBtn" style="font-size:1.2rem;">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label">Dashboard Theme</label>
        <select class="form-control" id="themeSelect">
          <option value="modern_dark">Modern Dark</option>
          <option value="warm_pub">Warm Pub</option>
          <option value="cyberpunk">Cyberpunk Neon</option>
          <option value="light_minimal">Light Minimalist</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Header Title</label>
        <input type="text" class="form-control" id="headerTitleInput" value="Hazardous Brews" />
      </div>

      <div class="form-group">
        <label class="form-label">Header Title Font</label>
        <select class="form-control" id="titleFontSelect">
          <option value="Outfit">Outfit</option>
          <option value="Carter One">Carter One</option>
          <option value="Balsamiq Sans">Balsamiq Sans</option>
          <option value="Fredoka">Fredoka</option>
          <option value="Permanent Marker">Permanent Marker</option>
          <option value="Montserrat">Montserrat</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Body Text Font</label>
        <select class="form-control" id="bodyFontSelect">
          <option value="Inter">Inter</option>
          <option value="Balsamiq Sans">Balsamiq Sans</option>
          <option value="Outfit">Outfit</option>
          <option value="Fredoka">Fredoka</option>
          <option value="Montserrat">Montserrat</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Update Admin PIN (4-Digits)</label>
        <input type="password" class="form-control" id="pinInputSetting" placeholder="Leave blank to keep unchanged" maxlength="4" />
      </div>

      <button id="saveSettingsBtn" class="btn-primary" style="margin-top:1rem;">Save Studio Settings</button>
    </div>
  </div>

  <script src="graphics.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
