name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Generate exact formatting patch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      head-sha: ${{ steps.patch.outputs.head-sha }}
      patch-present: ${{ steps.patch.outputs.patch-present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - id: patch
        name: Format and validate the patch
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          git diff --check
          if git diff --numstat | awk '$1 == "-" || $2 == "-" { exit 1 }'; then :; else
            echo 'Formatting patch contains a binary change.' >&2
            exit 1
          fi
          if git diff --summary | grep -Eq '^( create mode| delete mode| rename | mode change)'; then
            echo 'Formatting patch changes file modes or paths.' >&2
            exit 1
          fi
          while IFS= read -r path; do
            case "$path" in
              src/*.js|scripts/*.js|public/*.js|public/*.css|public/*.html|test/*.js|\
              package.json|package-lock.json|eslint.config.js|.prettierrc.json|.prettierignore|\
              .github/workflows/*.yml|.github/dependabot.yml|README.md|architecture.md|\
              docs/SECURITY.md|docs/DATABASE-OPERATIONS.md) ;;
              *) echo "Formatting patch contains a non-allowlisted path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only --diff-filter=ACDMRTUXB)
          git diff --binary --no-ext-diff > formatting.patch
          if [ "$(wc -c < formatting.patch)" -gt 1048576 ]; then
            echo 'Formatting patch exceeds 1 MiB.' >&2
            exit 1
          fi
          printf 'head-sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -s formatting.patch ]; then
            echo 'patch-present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'patch-present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formatting-patch
          path: formatting.patch
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Node 22 quality
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.format.outputs.head-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formatting-patch
      - name: Apply exactly the validated patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s formatting.patch ]; then
            git diff --quiet
            exit 0
          fi
          git apply --check formatting.patch
          git apply formatting.patch
          git diff --binary --no-ext-diff > applied.patch
          cmp --silent formatting.patch applied.patch
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  container:
    name: Secret-free production image
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.format.outputs.head-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formatting-patch
      - name: Apply exactly the validated patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s formatting.patch ]; then
            git diff --quiet
            exit 0
          fi
          git apply --check formatting.patch
          git apply formatting.patch
          git diff --binary --no-ext-diff > applied.patch
          cmp --silent formatting.patch applied.patch
      - run: docker build --file Dockerfile --tag tapboard-ci:${{ github.sha }} .

  writeback:
    name: Write back formatting
    needs: [format, quality, container]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      patch-applied: ${{ steps.writeback.outputs.patch-applied }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.format.outputs.head-sha }}
          fetch-depth: 2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: formatting-patch
      - id: writeback
        name: Commit the exact validated patch when needed
        env:
          EXPECTED_HEAD: ${{ needs.format.outputs.head-sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s formatting.patch ]; then
            echo 'patch-applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote_head="$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git apply --check formatting.patch
          git apply formatting.patch
          git diff --binary --no-ext-diff > applied.patch
          cmp --silent formatting.patch applied.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-only -z | xargs -0 git add --
          git commit -m 'style: apply formatting'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          echo 'patch-applied=true' >> "$GITHUB_OUTPUT"

  format-policy:
    name: Final formatting policy
    needs: [format, quality, container, writeback]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a clean PR after any validated patch
        env:
          EVENT_NAME: ${{ github.event_name }}
          PATCH_PRESENT: ${{ needs.format.outputs.patch-present }}
          WRITEBACK_RESULT: ${{ needs.writeback.result }}
          PATCH_APPLIED: ${{ needs.writeback.outputs.patch-applied }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success
          test "$CONTAINER_RESULT" = success
          if [ "$PATCH_PRESENT" = false ]; then exit 0; fi
          if [ "$EVENT_NAME" = pull_request ] && [ "$WRITEBACK_RESULT" = success ] && [ "$PATCH_APPLIED" = true ]; then
            exit 0
          fi
          echo 'Formatting changes are required. Fork pull requests cannot be written back automatically.' >&2
          exit 1
